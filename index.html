<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contract Jungle Escape</title><link rel="stylesheet" href="style.css"></head><body>
<section id="home" class="screen active"><h1>🌴 Contract Jungle Escape</h1><p>Pac-Man inspired learning adventure on Formation of Contracts in Malaysia.</p><button id="play">Play</button></section>
<section id="game" class="screen"><div class="hud"><span id="prog"></span><span id="score"></span></div><canvas id="gameCanvas" width="700" height="420"></canvas><div id="questionBox"></div><div id="touch"><button onclick="move('up')">▲</button><div><button onclick="move('left')">◄</button><button onclick="move('right')">►</button></div><button onclick="move('down')">▼</button></div><button id="restart">Restart</button></section>
<section id="end" class="screen"><h2>Adventure Complete</h2><p id="final"></p><button onclick="location.reload()">Play Again</button></section><script src="script.js"></script></body></html>
